name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a fresh push doesn't queue behind a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # matches engines (20.x) / .nvmrc — CI was on 18
          cache: npm

      # `npm ci` (not `npm install`): installs the EXACT locked tree for reproducible
      # runs. The lockfile pins @supabase/supabase-js 2.108.2 (matching the 2.108 CLI),
      # which resolved the old generated-DB-types `never` collapse — see Typecheck.
      - name: Install dependencies
        run: npm ci

      # BLOCKING. The generated DB types no longer collapse to `never`: once the SDK
      # was aligned with the CLI (both 2.108), a clean-install `tsc --noEmit` is green
      # in CI (verified — 0 TS errors). This is now an enforced gate; keep it green.
      - name: Typecheck
        run: npm run typecheck

      # NON-BLOCKING (pending one green run): `next build` fails in CI not on types but
      # on env. ~86 routes construct an external client at MODULE load (Supabase via
      # createClient, Stripe via `new Stripe(process.env.STRIPE_SECRET_KEY!)` in
      # lib/stripe/server, etc.), so importing the module during page-data collection
      # throws when the env is absent. The placeholder env below lets those constructors
      # succeed (the routes are force-dynamic and don't actually call out at build time).
      # The real fix is lazy client init; until then this unblocks the build in CI.
      # Flip to blocking once a CI run confirms green end-to-end.
      - name: Build
        run: npm run build
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          # Non-secret-looking placeholders on purpose: the constructors accept any
          # non-empty string, and real-key prefixes (sk_, whsec_) trip the gitleaks hook.
          STRIPE_SECRET_KEY: placeholder-stripe-secret-key
          STRIPE_WEBHOOK_SECRET: placeholder-stripe-webhook-secret
          OPENAI_API_KEY: placeholder-openai-key

      # NON-BLOCKING: the repo currently has ~293 eslint errors (mostly auto-fixable —
      # @ts-ignore→@ts-expect-error, prefer-const). Surfaced as annotations; flip to
      # blocking once the backlog is cleared (tracked separately).
      - name: Lint
        run: npm run lint
        continue-on-error: true

# e2e (Playwright) runs in its own workflow (.github/workflows/playwright.yml),
# which sets up a server properly. It intentionally isn't duplicated here as a
# swallowed `|| echo` step that could never actually fail the build.
