name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a fresh push doesn't queue behind a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # matches engines (20.x) / .nvmrc — CI was on 18
          cache: npm

      # `npm ci` (not `npm install`): installs the EXACT locked tree for reproducible
      # runs. The lockfile pins @supabase/supabase-js 2.108.2 (matching the 2.108 CLI),
      # which resolved the old generated-DB-types `never` collapse — see Typecheck.
      - name: Install dependencies
        run: npm ci

      # BLOCKING. The generated DB types no longer collapse to `never`: once the SDK
      # was aligned with the CLI (both 2.108), a clean-install `tsc --noEmit` is green
      # in CI (verified — 0 TS errors). This is now an enforced gate; keep it green.
      - name: Typecheck
        run: npm run typecheck

      # BLOCKING, and cheap (a filesystem scan, no install beyond what's here).
      # A missing image never throws — Next renders alt text or nothing at all, which is
      # correct degradation and a perfect hiding place. When this was first written it found
      # SIX assets 404ing in production, including the DEFAULT OG image (so every link
      # preview using the fallback was broken) and a logo whose file had been renamed in a
      # rebrand nine months earlier, leaving eight dead references behind. Nothing noticed,
      # because nothing was watching. Graceful degradation and silent failure are the same
      # mechanism seen from two sides.
      # It also catches the mirror failure — an asset that is PRESENT and absurd (a 1175 KB
      # logo rendered at 48px was introduced while fixing the six above).
      #
      # `verify:assets` runs --selftest FIRST, then the check. The selftest spawns the script
      # against fixture directories and asserts its EXIT CODE, so a guard that is defined but
      # never wired into the exit path fails the build here rather than being blessed by the
      # very check it was meant to strengthen. Not hypothetical: the weight guard shipped dead
      # exactly that way and printed a green checkmark, and the first selftest missed it by
      # calling the guard functions directly instead of running the script.
      # Enforce, don't hope — including on the enforcement.
      - name: Verify image assets resolve
        run: npm run verify:assets

      # BLOCKING. The SDK clients that used to throw at MODULE load with no env
      # (Stripe/OpenAI/Resend constructors) are now lazy (lib/lazyClient.ts), so
      # importing route modules during page-data collection no longer fails. The
      # remaining placeholder env just satisfies benign module-level `createClient()`
      # calls (which only need a non-empty URL) and a couple of envOrThrow reads in
      # the seed helpers. Verified green in a CI-equivalent build (placeholder env
      # only, no .env.local). Keep it green.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          # Non-secret-looking placeholders on purpose: the constructors accept any
          # non-empty string, and real-key prefixes (sk_, whsec_) trip the gitleaks hook.
          STRIPE_SECRET_KEY: placeholder-stripe-secret-key
          STRIPE_WEBHOOK_SECRET: placeholder-stripe-webhook-secret
          OPENAI_API_KEY: placeholder-openai-key

      # BLOCKING. eslint reports 0 errors: a stale Next-14 no-restricted-syntax rule
      # (forbidding required Next 15 `await headers()`) was removed, prefer-const was
      # fixed, and the remaining backlog (rules-of-hooks, ban-ts-comment, etc.) was
      # baselined to 'warn' in .eslintrc.cjs. Lint now blocks NEW errors; the warn'd
      # rules are tracked to ratchet back to 'error' as the debt is burned down.
      - name: Lint
        run: npm run lint

      # BLOCKING. Jest unit tests (jsdom). Currently the money-path fee math
      # (lib/commerce/__tests__) — the highest-value pure logic. The legacy
      # admin/__tests__ suite is quarantined in jest.config.mjs pending revival.
      - name: Unit tests
        run: npm run test:unit

# e2e (Playwright) runs in its own workflow (.github/workflows/playwright.yml),
# which sets up a server properly. It intentionally isn't duplicated here as a
# swallowed `|| echo` step that could never actually fail the build.
