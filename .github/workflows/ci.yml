name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a fresh push doesn't queue behind a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # matches engines (20.x) / .nvmrc — CI was on 18
          cache: npm

      # `npm ci` (not `npm install`): installs the EXACT locked tree. `npm install`
      # re-resolved a newer transitive @supabase/postgrest-js, which broke the
      # (stale) generated DB types into ~hundreds of `… on type 'never'` errors.
      # The lockfile pins the versions that typecheck clean.
      - name: Install dependencies
        run: npm ci

      # NON-BLOCKING for now: a clean-install typecheck surfaces the stale generated
      # DB types collapsing to `never` (~hundreds of TS2339). This passes locally but
      # not in a fresh CI env — entangled with the supabase-types regen (tracked).
      # Flip to blocking once that's resolved.
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      # BLOCKING: a real compile of the whole app. (Sitemap generation is a build
      # artifact, not a quality gate, and is handled by the deploy pipeline — it was
      # removed here: `ts-node *.ts` fails under Node 20's ESM loader.)
      - name: Build
        run: npm run build

      # NON-BLOCKING for now: the repo currently has ~300 eslint errors. Surfaced as
      # an annotation here; flip to blocking once the backlog is at zero (tracked).
      - name: Lint
        run: npm run lint
        continue-on-error: true

# e2e (Playwright) runs in its own workflow (.github/workflows/playwright.yml),
# which sets up a server properly. It intentionally isn't duplicated here as a
# swallowed `|| echo` step that could never actually fail the build.
