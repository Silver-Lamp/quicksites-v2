name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a fresh push doesn't queue behind a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # matches engines (20.x) / .nvmrc — CI was on 18
          cache: npm

      - name: Install dependencies
        run: npm install

      # BLOCKING: keep the typed-client surface green. This is the gate the team relies on.
      - name: Typecheck
        run: npm run typecheck

      - name: Generate Sitemap
        run: npm run generate:sitemap

      # BLOCKING: a real compile of the whole app.
      - name: Build
        run: npm run build

      # NON-BLOCKING for now: the repo currently has ~300 eslint errors. Surfaced as
      # an annotation here; flip to blocking once the backlog is at zero (tracked).
      - name: Lint
        run: npm run lint
        continue-on-error: true

# e2e (Playwright) runs in its own workflow (.github/workflows/playwright.yml),
# which sets up a server properly. It intentionally isn't duplicated here as a
# swallowed `|| echo` step that could never actually fail the build.
