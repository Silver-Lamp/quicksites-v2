name: Nightly Analytics Export

on:
  schedule:
    - cron: '0 6 * * *' # Every day at 6:00 UTC
  workflow_dispatch: # manual trigger

permissions:
  contents: write # the job commits reports back to the repo
  issues: write # so a failure can open an issue (see the notify step)

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Run export script
        run: npx tsx scripts/export-analytics.ts

      - name: Generate index.json
        run: |
          mkdir -p reports/analytics
          ls reports/analytics/*.csv | jq -R -s -c 'split("\n") | map(select(length > 0) | split("/") | .[-1])' > reports/analytics/index.json

      - name: Commit updated reports
        run: |
          git config user.name "quicksites-bot"
          git config user.email "support@quicksites.ai"
          git add reports/analytics
          git commit -m "📊 Nightly analytics snapshot [skip ci]" || echo "Nothing to commit"
          git push

      # ⚠️ This job had NO failure alerting whatsoever, which is why it ran red every night from
      # 2026-02-13 without anyone noticing. It has also never produced output: `reports/analytics/`
      # does not exist, because the job dies before writing anything.
      #
      # ⚠️ It fails for a reason adding secrets will NOT fix: the workflow passes SUPABASE_URL while
      # scripts/export-analytics.ts reads NEXT_PUBLIC_SUPABASE_URL. Setting a secret named
      # SUPABASE_URL produces the identical error, which is how a name mismatch survives a fix.
      - name: Report the failure somewhere it will be seen
        if: ${{ failure() }}
        uses: ./.github/actions/notify-failure
        with:
          title: 'Nightly Analytics Export is failing'
          body: 'Never produced output since 2026-02-13. The workflow passes SUPABASE_URL but scripts/export-analytics.ts reads NEXT_PUBLIC_SUPABASE_URL, so adding a SUPABASE_URL secret will not fix it. Consider deleting this job instead — nothing consumes its output.'
          token: ${{ secrets.GITHUB_TOKEN }}
