name: Nightly Analytics Export

on:
  schedule:
    - cron: '0 6 * * *' # Every day at 6:00 UTC
  workflow_dispatch: # manual trigger

permissions:
  contents: write # the job commits reports back to the repo
  issues: write # so a failure can open an issue (see the notify step)

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      # ⚠️ THE NAMES MUST MATCH WHAT THE SCRIPT READS. This block used to export SUPABASE_URL while
      # scripts/export-analytics.ts reads NEXT_PUBLIC_SUPABASE_URL, so the job failed with
      # "supabaseUrl is required" every night from 2026-02-13 — and adding a secret called
      # SUPABASE_URL would have produced the identical error, which is how a name mismatch survives
      # its own fix. The key accepts either name because this project migrated to the new Supabase
      # API keys (SUPABASE_SECRET_KEY) while the older name still works.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Run export script
        run: npx tsx scripts/export-analytics.ts

      - name: Generate index.json
        run: |
          mkdir -p reports/analytics
          ls reports/analytics/*.csv | jq -R -s -c 'split("\n") | map(select(length > 0) | split("/") | .[-1])' > reports/analytics/index.json

      - name: Commit updated reports
        run: |
          git config user.name "quicksites-bot"
          git config user.email "support@quicksites.ai"
          git add reports/analytics
          git commit -m "📊 Nightly analytics snapshot [skip ci]" || echo "Nothing to commit"
          git push

      # ⚠️ This job had NO failure alerting whatsoever, which is why it ran red every night from
      # 2026-02-13 without anyone noticing. It has also never produced output: `reports/analytics/`
      # does not exist, because the job dies before writing anything.
      #
      # The variable-name mismatch that caused those failures is fixed above. If this still fails,
      # the repository secrets themselves are unset — the step's own error names which ones.
      - name: Report the failure somewhere it will be seen
        if: ${{ failure() }}
        uses: ./.github/actions/notify-failure
        with:
          title: 'Nightly Analytics Export is failing'
          body: 'The variable-name mismatch (SUPABASE_URL vs NEXT_PUBLIC_SUPABASE_URL) was fixed on 2026-09-24. If this is failing again, check that the repository secrets NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SECRET_KEY are actually set — the failing step names whichever is missing.'
          token: ${{ secrets.GITHUB_TOKEN }}
