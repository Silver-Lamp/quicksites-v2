name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Filesystem scan of the checked-out tree (not git history). This catches any
      # secret committed into tracked files on this ref, while ignoring the known
      # historical leak that lives only in old history (neutralized by key rotation
      # — see docs/SECRET_ROTATION_RUNBOOK.md). Non-zero exit fails the job.
      - name: Scan working tree for secrets
        run: gitleaks detect --no-git --source . --redact --verbose
