name: 🕓 Nightly Sitemap Snapshot

on:
  schedule:
    - cron: '0 3 * * *' # 3:00 AM UTC daily
  workflow_dispatch:

permissions:
  contents: write # the job commits snapshots back to the repo
  issues: write # so a failure can open an issue (see the notify step)

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm install -D tsx

      - name: Create snapshot folder
        run: mkdir -p snapshots

      - name: Fetch sitemap index
        run: curl -sSL https://quicksites.ai/api/sitemap-index.xml -o snapshots/sitemap-index.xml

      - name: Fetch hreflang sitemap
        run: curl -sSL https://quicksites.ai/api/sitemap.hreflang.xml -o snapshots/sitemap-hreflang.xml

      - name: Commit snapshots
        run: |
          git config --global user.name "quicksites-bot"
          git config --global user.email "support@quicksites.ai"
          git add snapshots/*.xml
          git commit -m "📦 nightly sitemap snapshot [skip ci]" || echo "No changes to commit"
          git push

      - name: Upload to Supabase Storage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/upload-sitemaps.ts
      - name: Cleanup old sitemaps and update 'latest'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/cleanup-sitemaps.ts
      - name: Upload XML diffs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/upload-diffs.ts
      - name: Upload Markdown sitemap diffs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npx tsx scripts/upload-diffs-markdown.ts
      - name: Commit markdown diffs to repo
        run: |
          mkdir -p reports
          curl -sSL https://kcwruliugwidsdgsrthy.supabase.co/storage/v1/object/public/sitemaps/sitemap-index.diff.md -o reports/sitemap-index.diff.md
          curl -sSL https://kcwruliugwidsdgsrthy.supabase.co/storage/v1/object/public/sitemaps/sitemap-hreflang.diff.md -o reports/sitemap-hreflang.diff.md

          git config --global user.name "quicksites-bot"
          git config --global user.email "support@quicksites.ai"
          git add reports/*.diff.md
          git commit -m "📝 nightly sitemap markdown diffs [skip ci]" || echo "No changes to commit"
          git push
      # ⚠️ TWO ALERT PATHS USED TO SIT HERE AND NEITHER COULD EVER HAVE FIRED.
      # The Slack step needed a SLACK_WEBHOOK secret that was never set (it logged its own
      # "Secret `SLACK_WEBHOOK` is missing" error and moved on), and the email step was addressed
      # to the literal placeholder `your@email.com`. So this job failed every night from
      # 2026-02-13 onward — 60+ consecutive runs — and told nobody, because the thing that was
      # supposed to tell somebody was broken in two independent ways.
      #
      # Replaced with a channel that needs NO secret: a GitHub issue opened by the built-in token.
      # An alert that depends on configuration nobody has set is indistinguishable from no alert.
      - name: Report the failure somewhere it will be seen
        if: ${{ failure() }}
        uses: ./.github/actions/notify-failure
        with:
          title: 'Nightly Sitemap Snapshot is failing'
          body: 'The nightly sitemap job failed. The upload scripts now use a SERVICE-ROLE client (scripts/lib/storageClient.ts) instead of the browser/anon client, and the workflow passes the names those scripts read. If it is still failing, check the repository secrets NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SECRET_KEY — the client throws naming whichever is missing.'
          token: ${{ secrets.GITHUB_TOKEN }}
